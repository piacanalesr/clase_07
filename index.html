<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <title>Ejemplo</title>

        <style>
            * {
                margin: 0;
                padding: 0;
            }
            div#potato {
                width: 800px;
                margin: 0 auto;
                background: green;
            }

            div#potato div {
                border: 1px solid blue;
                width: calc(46% - 2px);
                padding: 1%;
                margin: 1%;
                float: left;
            }

            div#potato div.destacado {
                border: 1px solid blue;
                width: calc(96% - 2px);
                padding: 1%;
                margin: 1%;
            }

            div#potato div.fin {
                width: 100%;
                clear: both;
                background: greenyellow;
            }
        </style>
    </head>

    <body>
        <div id="potato"></div>

        <script>
            

/* Margaret Court: 24 títulos.
Serena Williams: 23 títulos.
Steffi Graf: 22 títulos.
Helen Wills Moody: 19 títulos.
Martina Navratilova: 18 títulos.

      const tenis = [
        {name: "Margaret Court ", titles:24 },
        {name: "Serena Williams ", titles:23 },
        {name: "Steffi Graf ", titles:22 },
        {name: "Helen Wills Moody ", titles:19 },
        {name: "Martina Navratilova ", titles:18 },
     ];

*/

            const trabajos = [
                {
                    title: "perrito super cute",
                    category: "destacado",
                    photo: "https://picsum.photos/id/237/300/300",
                    description: "este trabajo cute lo hice tal año para tal curso",
                },

                {
                    title: "mi super trabajo",
                    category: "ux",
                    photo: "https://picsum.photos/id/47/300/300",
                    description: "este trabajo cute lo hice tal año para tal curso",
                },

                {
                    title: "mi super trabajo",
                    category: "ux",
                    photo: "https://picsum.photos/id/127/300/300",
                    description: "este trabajo cute lo hice tal año para tal curso",
                },

                {
                    title: "mi super trabajo",
                    category: "ux",
                    photo: "https://picsum.photos/id/354/300/300",
                    description: "este trabajo cute lo hice tal año para tal curso",
                },

                {
                    title: "mi super trabajo",
                    category: "ux",
                    photo: "https://picsum.photos/id/800/300/300",
                    description: "este trabajo cute lo hice tal año para tal curso",
                },

            ];

            const parrafos = document.querySelector("#potato"); //el # hace que busque una identidad.
            trabajos.forEach((v) => {

                parrafos.innerHTML += `
      <div class="${v.category}">
        <h1>${v.title}</h1>
        <img src="${v.photo}" />
        <p>${v.description}</p>
      </div>`;
            });

            parrafos.innerHTML += `<div class="fin">Fin!!</div>`;
        </script>
    </body>
</html>
